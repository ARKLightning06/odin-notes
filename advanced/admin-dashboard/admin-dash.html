<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin-dash-styles.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="sidebar-heading">
                <img src="SVGs/view-dashboard.svg" class="icon">
                Dashboard
            </div>
            <div class="sidebar-list">
                <div class="sidebar-item">
                    <img src="SVGs/home.svg" class="icon-small">
                    Home
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/id-card.svg" class="icon-small">
                    Profile
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/message.svg" class="icon-small">
                    Messages
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/clock-time-three.svg" class="icon-small">
                    History
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/note-multiple.svg" class="icon-small">
                    Tasks
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/account-group.svg" class="icon-small">
                    Communities
                </div>
            </div>
            <div class="sidebar-list">
                <div class="sidebar-item">
                    <img src="SVGs/cog.svg" class="icon-small">
                    Settings
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/help-circle.svg" class="icon-small">
                    Support
                </div>
                <div class="sidebar-item">
                    <img src="SVGs/shield-check.svg" class="icon-small">
                    Privacy
                </div>
            </div>
        </div>
        <div class="header">
            <div class="header-top">
                <img src="SVGs/magnify.svg" class="icon-small right-justify">
                <input type="text" class="search-bar">
                <img src="SVGs/bell-ring.svg" class="icon-small right-justify">
                <img src="link_sunglasses.jpg" class="pfp">
                 <div class="username">ARKLightning</div>
            </div>
            <div class="header-bottom">
                <img src="link_sunglasses.jpg" class="pfp-large">
                <div class="header-welcome">
                    <div class="header-welcome-top">Hello there,</div>
                    <div class="header-welcome-bottom">ARKLightning (@Andrew)</div>
                </div>
                <div class="header-buttons">
                    <button class="header-button">New</button>
                    <button class="header-button">Upload</button>
                    <button class="header-button">Share</button>
                </div>
            </div>
        </div>
        <div class="main-content">
            MAIN
            <div class="projects"></div>
            <div class="main-right">
                <div class="announcements"></div>
                <div class="trending"></div>
            </div>
        </div>
    </div>
</body>
</html>
